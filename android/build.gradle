// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Every Android module needs the pinned build-tools version, not just :app.
    // The Capacitor and Cordova plugin modules build too, and any one of them
    // left on the plugin default would try to download 35.0.0 and fail.
    plugins.withId('com.android.application') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
    plugins.withId('com.android.library') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
